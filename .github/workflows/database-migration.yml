name: Database Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migration-main
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reviewed migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Verify main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Database migrations can only run from main."
            exit 1
          fi

      - name: Check out approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration history
        run: pnpm db:check

      - name: Apply pending migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: pnpm db:migrate

      - name: Notify Slack
        if: ${{ always() }}
        continue-on-error: true
        env:
          MIGRATION_STATUS: ${{ job.status }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        run: |
          node --input-type=module <<'EOF'
          const status = process.env.MIGRATION_STATUS === "success" ? "成功" : "失敗";
          const actionUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          try {
            const response = await fetch("https://slack.com/api/chat.postMessage", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.SLACK_BOT_TOKEN ?? ""}`,
                "Content-Type": "application/json; charset=utf-8",
              },
              body: JSON.stringify({
                channel: process.env.SLACK_USER_ID ?? "",
                text: `DB Migration結果: ${status}\nActions: ${actionUrl}`,
              }),
            });
            const body = await response.json();

            if (!response.ok || body.ok !== true) {
              throw new Error("Slack notification failed");
            }
          } catch {
            console.error("Slack notification failed");
            process.exitCode = 1;
          }
          EOF
